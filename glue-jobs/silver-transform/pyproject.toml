[tool.poetry]
name = "silver-transform"
version = "0.1.0"
description = "AWS Glue job for transforming 3W drill data from ZIP files"
authors = ["Egbewatt Nkongho <egbewattnkonghob@gmail.com>"]
readme = "README.md"
packages = [{ include = "transformation" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
glue-core = { path = "../glue-core", develop = true }
# Used at staging time to re-encode the 3W files' nanosecond timestamps, which
# Spark cannot read. Also present in the Glue 4.0 runtime.
pyarrow = "^18.1.0"
py4j = "^0.10.9"  # Required by PySpark in AWS Glue runtime

[tool.poetry.group.dev.dependencies]
pyspark = "^3.5.1"  # For local testing only - AWS Glue runtime provides this
black = "^25.1.0"
pytest = "^8.4.1"
ruff = "^0.14.14"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
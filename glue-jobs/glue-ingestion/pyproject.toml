[tool.poetry]
name = "ingestion"
version = "0.1.0"
description = "AWS Glue job for ingesting data from Kaggle."
authors = ["Egbewatt Nkongho <egbewattnkonghob@gmail.com>"]
readme = "README.md"
packages = [{ include = "ingestion" }]
include = ["README.md"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
glue-core = { path = "../glue-core", develop = true }
requests = "^2.32.4"
boto3 = "^1.39.15"
omegaconf = "^2.3.0"
pydantic = "^2.11.7"
kaggle = "^1.5.12"
pyyaml = "^6.0"
py4j = "^0.10.9"  # Required by PySpark in AWS Glue runtime

[tool.poetry.group.dev.dependencies]
pyspark = "^3.5.1" # For local testing only - AWS Glue runtime provides this
black = "^25.1.0"
pytest = "^8.4.1"
ruff = "^0.14.14"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"glue_job.py" = ["F841"]  # Allow unused variables in glue_job.py

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "glue-core"
version = "0.1.0"
description = "Core components for AWS Glue jobs in drill data analysis pipeline"
authors = ["Egbewatt Nkongho <egbewattnkonghob@gmail.com>"]
readme = "README.md"
packages = [{ include = "core" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
boto3 = "^1.39.15"
omegaconf = "^2.3.0"
pydantic = "^2.11.7"
pyyaml = "^6.0"
requests = "^2.32.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"